spring.application.name=ocpp-lab
server.port=8080

# Matches docker-compose.yml (host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/ocpplab
spring.datasource.username=ocpplab
spring.datasource.password=ocpplab

# Kafka (docker-compose.yml, single KRaft broker)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# send() itself blocks while it waits for metadata; don't let that hang the relay for the default 60 s
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
# The listener commits the offset itself, after the database transaction has committed
spring.kafka.listener.ack-mode=manual_immediate

# Transactional outbox
outbox.topic=charging-session-events
outbox.relay.enabled=true
outbox.relay.interval-ms=500
outbox.relay.batch-size=100
outbox.relay.send-timeout-ms=10000

# Billing (BigDecimal, at most 4 decimals: billing_record.price_per_kwh is NUMERIC(12,4))
billing.price-per-kwh=0.30

logging.level.dev.ocpplab=DEBUG
