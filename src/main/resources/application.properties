spring.application.name=ocpp-lab
server.port=8080

# Matches docker-compose.yml (OCPPLAB_DB_PORT overrides the port in both places)
spring.datasource.url=jdbc:postgresql://localhost:${OCPPLAB_DB_PORT:5432}/ocpplab
spring.datasource.username=ocpplab
spring.datasource.password=ocpplab

logging.level.dev.ocpplab=DEBUG
