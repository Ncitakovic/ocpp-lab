services:
  postgres:
    image: postgres:16-alpine
    container_name: ocpplab-postgres
    environment:
      POSTGRES_DB: ocpplab
      POSTGRES_USER: ocpplab
      POSTGRES_PASSWORD: ocpplab
    ports:
      # Host port 5433 (5432 is often taken by another local Postgres); container port stays 5432.
      - "5433:5432"
    volumes:
      - ocpplab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocpplab -d ocpplab"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single Kafka broker in KRaft mode (no ZooKeeper): this one node is both broker and controller.
  # No volume: topics and consumer offsets are lost on `docker compose down`, which is fine for the lab.
  kafka:
    image: apache/kafka:3.9.1
    container_name: ocpplab-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so every internal topic can have only one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  ocpplab-data:
