services:
  postgres:
    image: postgres:16-alpine
    container_name: ocpplab-postgres
    environment:
      POSTGRES_DB: ocpplab
      POSTGRES_USER: ocpplab
      POSTGRES_PASSWORD: ocpplab
    ports:
      # Host port 5432 by default; set OCPPLAB_DB_PORT if 5432 is taken (use the same value for the server).
      - "${OCPPLAB_DB_PORT:-5432}:5432"
    volumes:
      - ocpplab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocpplab -d ocpplab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ocpplab-data:
